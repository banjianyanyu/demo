# 端口
server:
  port: 9002

# sa-token配置
sa-token:
  # 打印操作日志
  is-log: true
  # SSO-相关配置
  sso-client:
    # 应用标识
    client: sso-client2
    # SSO-Server 端主机地址
    server-url: http://sa-sso-server.com:9000
    # API 接口调用秘钥 (单点注销时会用到)
    secret-key: SSO-C2-kQwIOrYvnXmSDkwEiFngrKidMcdrgKor

  # 配置 Sa-Token 单独使用的Redis连接（此处需要和 SSO-Server 端连接同一个 Redis）
  # 注：使用 alone-redis 需要在 pom.xml 引入 sa-token-alone-redis 依赖
  alone-redis:
    # Redis数据库索引 (默认为0)
    database: 1
    # Redis服务器地址
    host: 127.0.0.1
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    password:
    # 连接超时时间
    timeout: 10s
