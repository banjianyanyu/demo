# 端口
server:
  port: 9000

# Sa-Token 配置
sa-token:
  json-converter: fastjson  # 明确指定使用 FastJSON
  # ⭐ 必须开启（非常关键）
  alone-redis: true
  # 打印操作日志
  is-log: true
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
    # SSO-模式一相关配置  (非模式一不需要配置)
    # cookie:
    # 配置 Cookie 作用域
    # domain: stp.com

  # SSO-Server 配置
  sso-server:
    # Ticket有效期 (单位: 秒)，默认五分钟
    ticket-timeout: 300
    # 应用列表：配置接入的应用信息
    clients:
      # 应用 sso-client1：采用模式一对接 (同域、同Redis)
      sso-client1:
        client: sso-client1
        allow-url: "*"
      # 应用 sso-client2：采用模式二对接 (跨域、同Redis)
      sso-client2:
        client: sso-client2
        allow-url: "*"
        secret-key: SSO-C2-kQwIOrYvnXmSDkwEiFngrKidMcdrgKor
      # 应用 sso-client3：采用模式三对接 (跨域、跨Redis)
      sso-client3:
        # 应用名称
        client: sso-client3
        # 允许授权地址
        allow-url: http://sa-sso-client1.com:9003/sso/login
        # 是否接收消息推送
        is-push: true
        # 消息推送地址
        push-url: http://sa-sso-client1.com:9003/sso/pushC
        # 接口调用秘钥 (如果不配置则使用全局默认秘钥)
        secret-key: SSO-C3-kQwIOrYvnXmSDkwEiFngrKidMcdrgKor
    # SSO-Server 配置
    sso-server:
      # 主页路由：在 /sso/auth 登录页不指定 redirect 参数时，默认跳转的地址
      home-route: /home

spring:
  # Redis配置 （SSO模式一和模式二使用Redis来同步会话）
  data:
    redis:
      # Redis数据库索引（默认为0）
      database: 1
      # Redis服务器地址
      host: 127.0.0.1
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password:
